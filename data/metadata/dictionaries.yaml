# Data dictionaries for every published dataset. Publishing fails if a column is undocumented.
# Optional per-column fields: unit, source, transformation, missing_treatment.
constructor_season:
  title: Constructor seasons
  description: One row per team lineage and season. Points and positions are from the official final constructor
    standings.
  key:
  - season
  - team_id
  sources:
  - jolpica
  columns:
    season:
      type: int
      description: Championship season
    team_id:
      type: str
      description: Stable team lineage ID (see config/team_mapping.yaml)
      transformation: Mapped from constructor_id using config/team_mapping.yaml
    constructor_id:
      type: str
      description: Constructor ID as used by Jolpica-F1 that season
    constructor_name:
      type: str
      description: Entrant name that season
    team_name:
      type: str
      description: Lineage display name
    position:
      type: int
      description: Final constructors' championship position
    points:
      type: float
      unit: points
      description: Final championship points (includes sprint points and penalties)
    wins:
      type: int
      description: Grand Prix wins
    races_entered:
      type: int
      description: Grands Prix with at least one car classified or retired
    car_starts:
      type: int
      description: Car entries in race results
    podiums:
      type: int
      description: Top-3 race finishes (both cars counted)
    classified_finishes:
      type: int
      description: Car entries recorded as finished or lapped
    mechanical_dnfs:
      type: int
      description: Retirements with a mechanical cause recorded. Under-counted from 2024 where status is often just
        "Retired"
      transformation: Count of race statuses classified as mechanical (src/f1moneyball/standardization/teams.py)
    mean_grid_to_finish:
      type: float
      unit: places
      description: Mean of (grid - finish) for classified cars. Positive = gained places
      transformation: Mean of grid minus finishing position, classified cars only; pit-lane start counted as last
        on grid
      missing_treatment: Blank if the team had no classified finish that season
    median_quali_gap_pct:
      type: float
      unit: '%'
      description: Median across the season of the team's best car gap to pole
      transformation: 'Per session: (team''s best time / fastest time - 1) x 100; then median over the season'
      missing_treatment: Blank if no valid qualifying time was recorded
    poles:
      type: int
      description: Sessions where the team's best car set the fastest qualifying time
    points_share:
      type: float
      unit: share
      description: Team points / all teams' points that season
      transformation: points / sum of all teams' points in the season
    points_per_race:
      type: float
      unit: points
      description: points / races_entered
    completion_rate:
      type: float
      unit: share
      description: classified_finishes / car_starts
    mechanical_dnf_rate:
      type: float
      unit: share
      description: mechanical_dnfs / car_starts
    regulatory_period:
      type: str
      description: Regulatory period label (config/seasons.yaml)
    median_pit_gap_s:
      type: float
      unit: seconds
      description: Median over the season's races of the team's pit stop gap to the fastest team in that race
      transformation: 'Per race: team median service stop - fastest team median (same race, same pit lane); then
        median over races. Stops over 60 s excluded'
      missing_treatment: Blank before 2011 or if the team had no comparable race
    pit_races:
      type: int
      description: Races in which the team's pit stop gap could be computed
      missing_treatment: Blank before 2011
    service_pit_stops:
      type: int
      description: Pit stops of 60 seconds or less in the season
      missing_treatment: Blank before 2011
    data_source:
      type: str
      description: 'Where the row came from: the automated Jolpica-F1 pull, or the standings snapshot (standings
        only; race-level variables blank)'
  limitations:
  - Points systems changed (fastest-lap point 2019 to 2024, sprint races from 2021). Compare points_share or position
    across eras, not raw points.
  - Mechanical retirements are under-counted from 2024, when many retirements are recorded only as 'Retired'.
  - 'Team lineages are a modelling choice: a rebrand is treated as the same team if the factory stays the same.'
  - 'Until the automated pull runs, rows come from a checked standings snapshot: points, position and wins only.'
competitive_balance:
  title: Competitive balance by season
  description: Concentration and mobility indicators computed from final constructor points.
  key:
  - season
  sources:
  - jolpica
  columns:
    season:
      type: int
      description: Championship season
    n_teams:
      type: int
      description: Number of constructors classified
    hhi:
      type: float
      unit: 0-1
      description: Herfindahl-Hirschman Index of points shares
      transformation: Computed in src/f1moneyball/feature_engineering/competitive_balance.py
    hhi_normalized:
      type: float
      unit: 0-1
      description: HHI adjusted for number of teams. 0 = equal shares
      transformation: Computed in src/f1moneyball/feature_engineering/competitive_balance.py
    gini:
      type: float
      unit: 0-1
      description: Gini coefficient of constructor points
      transformation: Computed in src/f1moneyball/feature_engineering/competitive_balance.py
    cv:
      type: float
      unit: ratio
      description: Coefficient of variation of constructor points
      transformation: Computed in src/f1moneyball/feature_engineering/competitive_balance.py
    sd_points:
      type: float
      unit: points
      description: Standard deviation of constructor points
    top3_share:
      type: float
      unit: share
      description: Points share of the top three teams
      transformation: Computed in src/f1moneyball/feature_engineering/competitive_balance.py
    winner_share_of_wins:
      type: float
      unit: share
      description: Share of race wins taken by the team with most wins
    leader_points_share:
      type: float
      unit: share
      description: Points share of the champion constructor
    rank_persistence:
      type: float
      unit: -1 to 1
      description: Spearman correlation of team rank with previous season rank
      transformation: Computed in src/f1moneyball/feature_engineering/competitive_balance.py
      missing_treatment: Blank for the first season in the window (no previous season)
    mean_abs_rank_change:
      type: float
      unit: places
      description: Mean absolute change in team rank from previous season
      missing_treatment: Blank for the first season in the window
    regulatory_period:
      type: str
      description: Regulatory period label
  limitations:
  - Computed from final constructor points only. Says nothing about race-by-race uncertainty.
  - HHI and Gini depend on the number of teams; use hhi_normalized when the grid size changes.
  - Descriptive indicators. A change after 2021 is not evidence that the cost cap caused it.
regulation_event:
  title: Regulation events
  description: Financial, technical, sporting and power-unit rule changes with effective dates and sources.
  key:
  - event_id
  sources:
  - fia_regulations
  columns:
    event_id:
      type: str
      description: Unique event ID
    effective_date:
      type: date
      description: Date the rule took effect
    season:
      type: int
      description: First season affected
    category:
      type: str
      description: financial | technical | sporting | power_unit
    title:
      type: str
      description: Short title
    description:
      type: str
      description: What changed
    value:
      type: float
      description: Numeric value where relevant (e.g. cap level)
    unit:
      type: str
      description: Unit of value
    source_name:
      type: str
      description: Source
    source_url:
      type: str
      description: Source URL
    source_type:
      type: str
      description: primary | secondary
    verified_against_primary:
      type: bool
      description: True once checked against the FIA document
  limitations:
  - Cost-cap values are sourced to secondary reporting until checked against the FIA regulations (see verified_against_primary).
  - Base cap levels only. Adjustments for extra races and inflation are not included.
financial_observation:
  title: Financial observations
  description: One row per reported or estimated financial figure, with full provenance. Entered manually and validated.
  key:
  - team_id
  - entity_name
  - financial_year_end
  - metric
  sources:
  - companies_house
  columns:
    team_id:
      type: str
      description: Team lineage
    season_mapped:
      type: int
      description: Season this financial year is mapped to (documented rule)
    entity_name:
      type: str
      description: Legal entity that reported the figure
    entity_registration:
      type: str
      description: Company registration number
    metric:
      type: str
      description: Financial metric
    value:
      type: float
      description: Original figure as reported, in full units of the original currency
      missing_treatment: Blank only when source_class = missing. Never estimated to fill a gap.
    currency:
      type: str
      description: ISO 4217 currency code
    financial_year_start:
      type: date
      description: Start of accounting period
    financial_year_end:
      type: date
      description: End of accounting period
    accounting_basis:
      type: str
      description: Accounting framework
    source_class:
      type: str
      description: audited | official_disclosure | secondary_estimate | derived_estimate | missing
    source_name:
      type: str
      description: Source
    source_url:
      type: str
      description: Source URL
    document_title:
      type: str
      description: Title of the source document (e.g. 'Annual report and financial statements, year ended 31 December
        2022')
    document_page:
      type: str
      description: Page in the source document
    publication_date:
      type: date
      description: Date the source was published or filed
    retrieval_date:
      type: date
      description: Date the figure was extracted from the document
    confidence:
      type: str
      description: high | medium | low
    entered_by:
      type: str
      description: Who entered the row
    notes:
      type: str
      description: Comparability and accounting notes
    transformation:
      type: str
      description: 'Any change made to the reported figure (e.g. ''sign flipped: loss reported in brackets''). ''none''
        if copied as reported.'
    comparability_warning:
      type: str
      description: Why this figure may not be comparable with other teams or years. Required for estimates.
    source_document_status:
      type: str
      description: 'Status of the filing this figure was read from (data/metadata/source_documents.csv): verified = official file has the same SHA-256 as the copy used; candidate_unverified = official link found, hash not yet compared; not_recorded = no filing named'
      transformation: Joined from data/metadata/source_documents.csv by the document named in notes
    source_document_url:
      type: str
      description: Official Companies House link to the filing, where known
      transformation: Joined from data/metadata/source_documents.csv
  limitations:
  - Figures belong to legal entities, not to 'teams'. An entity may include engine work or other business, or miss
    costs held in another company.
  - Accounting periods and currencies differ. Values are never converted or combined in this table.
  - Coverage is limited to entities that file comparable accounts, mainly in the UK.
pit_stop:
  title: Pit stops
  description: One row per pit stop from the Jolpica-F1 pit stop endpoint (2011 onwards), with the team and each
    team's gap to the fastest team in the same race.
  key:
  - season
  - round
  - driver_id
  - stop
  sources:
  - jolpica
  limitations:
  - Duration is total pit-lane time (entry to exit), not the stationary tyre change. It depends on the length of each
    pit lane, so seconds are compared only within a race.
  - Stops over 60 seconds (red-flag waits, repairs) are kept but flagged and left out of team comparisons.
  - The source does not label penalty or repair stops. Only the 60-second rule separates them, so short penalty
    stops stay in.
  columns:
    season:
      type: int
      description: Championship season
    round:
      type: int
      description: Round number within the season
    race_name:
      type: str
      description: Grand Prix name
    circuit_id:
      type: str
      description: Circuit ID
    driver_id:
      type: str
      description: Driver ID
    constructor_id:
      type: str
      description: Constructor ID, from the race results
    team_id:
      type: str
      description: Stable team lineage ID
      transformation: Joined from race results on season, round and driver
    stop:
      type: int
      description: Stop number for the driver in that race
    lap:
      type: int
      description: Lap of the stop
    duration_s:
      type: float
      unit: seconds
      description: Total pit-lane time as published
    is_long_stop:
      type: bool
      description: True if over 60 seconds or missing (red-flag wait, repair); excluded from team comparisons
    team_median_s:
      type: float
      unit: seconds
      description: Team's median service stop in this race
      missing_treatment: Blank for long stops or if fewer than 3 teams had service stops in the race
    gap_to_best_team_s:
      type: float
      unit: seconds
      description: team_median_s minus the fastest team's median in the same race
      missing_treatment: Blank when team_median_s is blank
race_result:
  title: Race results
  description: One row per car per Grand Prix from the Jolpica-F1 race results endpoint, with retirement causes
    classified.
  key:
  - season
  - round
  - driver_id
  sources:
  - jolpica
  limitations:
  - Sprint race results are not included.
  - Retirement causes are often unspecified from 2024.
  columns:
    season:
      type: int
      description: Championship season
    round:
      type: int
      description: Round number within the season
    race_name:
      type: str
      description: Grand Prix name
    date:
      type: date
      description: Race date
    circuit_id:
      type: str
      description: Circuit ID (Jolpica)
    driver_id:
      type: str
      description: Driver ID (Jolpica)
    driver_name:
      type: str
      description: Driver name
    constructor_id:
      type: str
      description: Constructor ID (Jolpica)
    team_id:
      type: str
      description: Team lineage
      transformation: Mapped via config/team_mapping.yaml
    grid:
      type: int
      description: Starting position; 0 = pit-lane start
    position:
      type: int
      description: Finishing order position as published (also given for non-classified cars)
    position_text:
      type: str
      description: Position as text; R = retired, D = disqualified, etc.
    points:
      type: float
      unit: points
      description: Points scored in the race
    laps:
      type: int
      description: Laps completed
    status:
      type: str
      description: Finishing status text as published
    status_class:
      type: str
      description: finished | mechanical | incident | disqualified | not_started | unspecified | other
      transformation: Rule-based classification of status
    classified:
      type: bool
      description: True if finished or lapped
    is_mechanical_dnf:
      type: bool
      description: True if retirement cause is mechanical
    grid_to_finish:
      type: float
      unit: places
      description: Grid minus finishing position for classified cars
      missing_treatment: Blank for non-classified cars
efficiency:
  title: Points relative to resources
  description: Descriptive comparison of each team's share of points with its share of resources, within groups
    of teams reporting the same measure, in the same currency, for the same season.
  key:
  - team_id
  - season
  - metric
  - entity_name
  sources:
  - companies_house
  - jolpica
  limitations:
  - Descriptive ratio, not a measure of technical or production efficiency, and not causal.
  - The ratio is unstable for teams with very few points, where one result moves it a lot.
  - Shares cover only the teams in the comparison group, not the whole grid.
  - 'No currency conversion: teams reporting in different currencies are never in the same group.'
  - Legal-entity accounts may not capture the full cost of running a team.
  columns:
    team_id:
      type: str
      description: Team lineage
    season:
      type: int
      description: Season the financial year is mapped to
    metric:
      type: str
      description: Financial measure used (one per row; measures are never combined)
    value:
      type: float
      description: Reported figure in original currency units
    currency:
      type: str
      description: ISO currency of value
    source_class:
      type: str
      description: Financial-data classification of the figure
    confidence:
      type: str
      description: high | medium | low
    entity_name:
      type: str
      description: Legal entity that reported the figure
    financial_year_end:
      type: date
      description: End of the accounting period
    exclusion_reason:
      type: str
      description: Why the row is not in a comparison group. Blank if included.
    team_name:
      type: str
      description: Lineage display name
    points:
      type: float
      unit: points
      description: Final championship points
    points_share:
      type: float
      unit: share
      description: Share of all teams' points (whole grid)
    position:
      type: int
      description: Final championship position
    wins:
      type: int
      description: Race wins
    podiums:
      type: int
      description: Podiums
    completion_rate:
      type: float
      unit: share
      description: Classified finishes / car starts
    mechanical_dnf_rate:
      type: float
      unit: share
      description: Mechanical retirements / car starts
    mean_grid_to_finish:
      type: float
      unit: places
      description: Average places gained, classified cars
    median_quali_gap_pct:
      type: float
      unit: '%'
      description: Median gap to pole
    is_reported:
      type: bool
      description: True for audited or officially disclosed figures; false for estimates
    group_n_teams:
      type: float
      description: Teams in the comparison group (season, metric, currency)
    resource_share:
      type: float
      unit: share
      description: Team value / sum of values in the group
      transformation: Computed in econometrics/efficiency.py
      missing_treatment: Blank when the row is excluded
    points_share_in_group:
      type: float
      unit: share
      description: Team points / points of teams in the group
      missing_treatment: Blank when the row is excluded
    points_to_resource_share_ratio:
      type: float
      unit: ratio
      description: 'Points-to-resource-share ratio (points-to-turnover-share ratio when metric is turnover) = points_share_in_group / resource_share. 1 = same share of points as of resources; above 1 = larger share of points. Called efficiency_ratio before version 3.1'
      missing_treatment: Blank when the row is excluded
    points_per_million:
      type: float
      unit: points per million currency units
      description: points / (value / 1,000,000), in the original currency
      missing_treatment: Blank when the row is excluded
    resource_rank:
      type: float
      description: Rank by value within the group (1 = largest)
    points_rank:
      type: float
      description: Rank by points within the group (1 = most)
    rank_gap:
      type: float
      unit: places
      description: 'resource_rank minus points_rank. Positive: finished higher than resources rank'
    included:
      type: bool
      description: True if the row is in a comparison group
model_results:
  title: Resources and performance models
  description: Regression estimates of points share on the previous season's log resources, by financial measure.
  key:
  - model_id
  sources:
  - companies_house
  - jolpica
  limitations:
  - Associations, not causal effects. Lagging resources reduces but does not remove reverse causality.
  - With few teams, clustered standard errors are unreliable.
  - Fixed-effects estimates rely on small within-team changes and are imprecise.
  columns:
    model_id:
      type: str
      description: Model identifier
    metric:
      type: str
      description: Financial measure
    currency:
      type: str
      description: Currency of the sample
    outcome:
      type: str
      description: Dependent variable
    regressor:
      type: str
      description: Main regressor
    specification:
      type: str
      description: Pooled OLS | Team fixed effects | Team and season fixed effects
    formula:
      type: str
      description: statsmodels formula
    estimated:
      type: bool
      description: False when the sample is too small to estimate
    n_obs:
      type: int
      description: Team-seasons used
    n_teams:
      type: int
      description: Teams (clusters)
    n_seasons:
      type: int
      description: Seasons
    coef:
      type: float
      description: Coefficient on log resources (lagged)
    se:
      type: float
      description: Standard error
    ci_low:
      type: float
      description: 95% CI lower bound, normal critical values (kept for comparison with earlier versions)
    ci_high:
      type: float
      description: 95% CI upper bound, normal critical values (kept for comparison with earlier versions)
    p_value:
      type: float
      description: Clustered p-value, normal reference distribution (kept for comparison with earlier versions)
    p_t:
      type: float
      description: Clustered p-value with the t distribution and G - 1 degrees of freedom (G = number of teams)
    ci_t_low:
      type: float
      description: 95% CI lower bound, coef - t(0.975, G - 1) x se
    ci_t_high:
      type: float
      description: 95% CI upper bound, coef + t(0.975, G - 1) x se
    p_wild:
      type: float
      description: Restricted wild cluster bootstrap p-value (Webb weights, 9,999 draws, seed 20261119); fixed-effects models only
    ci_boot_low:
      type: float
      description: Lower bound of the 95% interval from inverting the wild cluster bootstrap test; fixed-effects models only
    ci_boot_high:
      type: float
      description: Upper bound of the 95% interval from inverting the wild cluster bootstrap test; fixed-effects models only
    r2:
      type: float
      description: R-squared
    effect_10pct_pp:
      type: float
      unit: percentage points
      description: Change in points share associated with 10% more resources last season
    se_type:
      type: str
      description: Standard error type
    note:
      type: str
      description: Caveats for this model
robustness_checks:
  title: Robustness checks
  description: Sensitivity checks for the three studies. Each row is one estimate next to the main result it tests.
  key:
  - study
  - check_id
  - check
  - metric
  - model
  sources:
  - jolpica
  - companies_house
  - statistik_austria
  - ons
  limitations:
  - Associations and descriptive comparisons, not causal effects.
  - Models with six to eight teams stay imprecise even with bootstrap p-values and intervals.
  columns:
    study:
      type: str
      description: Article slug the check belongs to
    check_id:
      type: str
      description: Short check identifier
    check:
      type: str
      description: What the check changes
    metric:
      type: str
      description: Resource measure, balance indicator or tourism series
    model:
      type: str
      description: Model or specification
    coef:
      type: float
      description: 'Coefficient of interest (for the synthetic control row: mean post-entry gap, percent)'
    se:
      type: float
      description: 'Standard error (clustered by team, Newey-West or HAC as in the main model)'
    ci_low:
      type: float
      description: 95% CI lower bound
    ci_high:
      type: float
      description: 95% CI upper bound
    p_value:
      type: float
      description: 'Conventional p-value (clustered by team, normal reference distribution)'
    ci_boot_low:
      type: float
      description: 'Lower bound of the 95% interval from inverting the wild cluster bootstrap test (main fixed-effects models)'
    ci_boot_high:
      type: float
      description: 'Upper bound of the 95% interval from inverting the wild cluster bootstrap test (main fixed-effects models)'
    ci_t_low:
      type: float
      description: 95% CI lower bound with t(G - 1) critical values
    ci_t_high:
      type: float
      description: 95% CI upper bound with t(G - 1) critical values
    p_t:
      type: float
      description: 'Clustered p-value with the t distribution and G - 1 degrees of freedom (G = number of teams); a small-sample alternative to p_value'
    p_wild:
      type: float
      description: 'Wild cluster restricted bootstrap p-value, Webb weights, 9,999 draws'
    pct_effect:
      type: float
      description: 'Coefficient as a percent change (event studies)'
    r2:
      type: float
      description: R-squared
    n_obs:
      type: int
      description: 'Observations (team-seasons, seasons, months or units)'
    n_teams:
      type: int
      description: 'Teams (clusters)'
    baseline_coef:
      type: float
      description: The main estimate the check is compared with
    dropped:
      type: str
      description: 'Team left out (leave-one-team-out rows)'
    region:
      type: str
      description: 'Region (Grand Prix rows)'
    note:
      type: str
      description: Notes
cost_cap_models:
  title: Cost cap models
  description: Interrupted time series, placebo break years and dose-response estimates for the 2021 cost cap.
  key:
  - kind
  - indicator
  - break_year
  - specification
  sources:
  - jolpica
  - companies_house
  limitations:
  - 'No untreated control group: every team was capped in 2021.'
  - The 2022 technical reset follows one season later; spec B separates them using 2021 alone.
  - Only five capped seasons with comparable rules (2021-2025).
  - 'Dose-response results are suggestive: big spenders may also have adapted differently to the 2022 rules.'
  columns:
    kind:
      type: str
      description: its | placebo | dose_response
    indicator:
      type: str
      description: Outcome (balance indicator, or points_share for dose_response)
    break_year:
      type: int
      description: Season of the (real or placebo) break
    specification:
      type: str
      description: 'A: level and slope change; B: adds a 2022 technical-reset dummy; or the dose-response specification'
    formula:
      type: str
      description: statsmodels formula
    estimated:
      type: bool
      description: False when the sample is too small
    n_seasons:
      type: int
      description: Seasons used
    n_pre:
      type: int
      description: Seasons before the break
    n_post:
      type: int
      description: Seasons from the break
    n_obs:
      type: int
      description: Team-seasons (dose-response)
    n_teams:
      type: int
      description: Teams (dose-response clusters)
    level_change:
      type: float
      description: Estimated level change at the break (ITS), or exposure x post coefficient (dose-response)
    se:
      type: float
      description: Standard error
    ci_low:
      type: float
      description: 95% CI lower bound
    ci_high:
      type: float
      description: 95% CI upper bound
    mde_80:
      type: float
      description: 'Smallest level change the model could detect with 80% power at the 5% level (2.8 x standard error); the Newey-West standard error is itself likely too small with 16 seasons'
    p_value:
      type: float
      description: p-value
    slope_change:
      type: float
      description: Change in trend after the break (ITS)
    tech_level_change:
      type: float
      description: 2022 level change (spec B)
    r2:
      type: float
      description: R-squared
    se_type:
      type: str
      description: Standard error type
    placebo_share_as_large:
      type: float
      description: Share of placebo breaks with a level change at least as large in absolute value
    n_placebos:
      type: float
      description: Number of placebo breaks
    exposure_measure:
      type: str
      description: Financial measure and years used for exposure (dose-response)
    note:
      type: str
      description: Caveats
cost_cap_event_study:
  title: Cost cap event study
  description: Season-by-season coefficient on exposure (standardised log pre-cap resources) in a points-share regression
    with team and season effects, relative to 2020.
  key:
  - season
  sources:
  - jolpica
  - companies_house
  limitations:
  - Reference season 2020 is a COVID-19 season.
  - 'Few teams: clustered standard errors are unreliable.'
  - Pre-cap coefficients near zero support, but do not prove, parallel trends.
  columns:
    season:
      type: int
      description: Season
    coef:
      type: float
      description: Exposure coefficient for the season
    se:
      type: float
      description: Standard error (clustered by team)
    ci_low:
      type: float
      description: 95% CI lower
    ci_high:
      type: float
      description: 95% CI upper
    is_reference:
      type: bool
      description: True for the reference season (fixed at 0)
    period:
      type: str
      description: pre-cap | cost cap
    n_teams:
      type: int
      description: Teams with exposure
    exposure_measure:
      type: str
      description: Measure and years used
gp_tourism_monthly:
  title: Host-economy tourism series
  description: Official monthly tourism series for host economies and comparison regions, entered by hand with table
    references.
  key:
  - region_id
  - month
  - series
  sources:
  - statistik_austria
  - singapore_stb
  limitations:
  - Definitions differ across countries (arrivals vs overnight stays). Compare within a series only.
  - Monthly data cannot isolate a single race weekend.
  - Comparison regions must be chosen before looking at results; the choice is recorded in notes.
  columns:
    region_id:
      type: str
      description: Region identifier
    region_name:
      type: str
      description: Region name
    country:
      type: str
      description: Country
    is_host:
      type: bool
      description: True if the region hosts a Grand Prix
    month:
      type: str
      description: Month (YYYY-MM)
    series:
      type: str
      description: arrivals | overnight_stays | hotel_occupancy
    value:
      type: float
      description: Value as published
    unit:
      type: str
      description: Unit as published
    source_name:
      type: str
      description: Official source
    source_url:
      type: str
      description: Source URL
    table_id:
      type: str
      description: Table or series ID at the source
    retrieval_date:
      type: date
      description: Date downloaded
    notes:
      type: str
      description: Definitions, breaks in series, why the region was chosen
gp_race_events:
  title: Grand Prix race dates
  description: Hosted races used to mark race months.
  key:
  - region_id
  - year
  sources:
  - jolpica
  limitations:
  - Race month is the month of the race start date.
  columns:
    region_id:
      type: str
      description: Region identifier (matches gp_tourism_monthly)
    race_name:
      type: str
      description: Race name
    year:
      type: int
      description: Year
    race_start_date:
      type: date
      description: First day of the race weekend
    race_end_date:
      type: date
      description: Race day
    source_url:
      type: str
      description: Source
    notes:
      type: str
      description: Notes
gp_event_study:
  title: Race-month event study
  description: Change in the monthly host series around race months, against the seasonal pattern and trend.
  key:
  - region_id
  - series
  - k
  sources:
  - statistik_austria
  - singapore_stb
  limitations:
  - 'No comparison region: descriptive, not causal.'
  - A race month may coincide with other events or holidays.
  columns:
    region_id:
      type: str
      description: Host region
    region_name:
      type: str
      description: Host name
    series:
      type: str
      description: Series
    k:
      type: float
      description: Months relative to the race month (0 = race month)
    estimated:
      type: bool
      description: False when the sample is too small
    coef:
      type: float
      description: Coefficient (log points)
    se:
      type: float
      description: HAC standard error
    ci_low:
      type: float
      description: 95% CI lower
    ci_high:
      type: float
      description: 95% CI upper
    pct_effect:
      type: float
      description: 'Approximate % difference: exp(coef) - 1'
      unit: '%'
    n_months:
      type: int
      description: Months used
    n_races:
      type: int
      description: Races in the sample
    note:
      type: str
      description: Caveats
gp_scm_path:
  title: Synthetic control paths
  description: Observed and synthetic log monthly series for each host around its first race in the data.
  key:
  - region_id
  - series
  - month
  sources:
  - statistik_austria
  limitations:
  - Valid only if the pre-entry fit is good (see gp_scm_inference).
  - Other events after entry also enter the gap.
  columns:
    region_id:
      type: str
      description: Host region
    series:
      type: str
      description: Series
    month:
      type: str
      description: Month
    observed:
      type: float
      description: Observed log value
    synthetic:
      type: float
      description: Synthetic log value
    gap:
      type: float
      description: Observed minus synthetic (log points)
    period:
      type: str
      description: pre-entry | post-entry
gp_scm_inference:
  title: Synthetic control inference
  description: Fit and placebo-in-space inference for each host synthetic control.
  key:
  - region_id
  - series
  - unit
  sources:
  - statistik_austria
  - singapore_stb
  limitations:
  - With few comparison regions the smallest possible p-value is 1/(regions+1).
  - Poor pre-entry fit invalidates the estimate.
  columns:
    region_id:
      type: str
      description: Host region
    series:
      type: str
      description: Series
    unit:
      type: str
      description: Host or placebo region
    is_host:
      type: bool
      description: True for the real host
    estimated:
      type: bool
      description: False when not estimated
    entry_month:
      type: str
      description: Month of first race in the data
    rmspe_pre:
      type: float
      description: Root mean squared gap before entry (log points)
    rmspe_post:
      type: float
      description: Root mean squared gap after entry
    rmspe_ratio:
      type: float
      description: Post / pre RMSPE
    mean_post_gap_pct:
      type: float
      description: Mean post-entry gap, approximately in %
      unit: '%'
    p_value:
      type: float
      description: 'Placebo p-value: rank of the host''s ratio among all units'
    weights:
      type: str
      description: Comparison-region weights (host only)
    poor_pre_fit:
      type: bool
      description: True if pre-entry RMSPE above 0.10
    note:
      type: str
      description: Caveats
financial_comparability:
  title: Financial comparability
  description: 'How well each team-season''s accounts measure the team''s racing resources, classified from facts recorded from the filings (see src/f1moneyball/econometrics/comparability.py for the rules).'
  key:
  - team_id
  - season
  - metric
  sources:
  - companies_house
  limitations:
  - Categories are rule-based from recorded facts; they are not scores and do not rank teams.
  - Facts that were not recorded from a filing cannot affect the category.
  columns:
    team_id:
      type: string
      description: Team lineage
    season:
      type: int
      description: Season the accounting period is mapped to
    metric:
      type: string
      description: 'Resource measure: turnover, staff_costs or headcount'
    category:
      type: string
      description: 'High, Moderate, Limited or Insufficient information'
    reasons:
      type: string
      description: The recorded facts behind the category
    accounting_basis:
      type: string
      description: 'Accounting standard and scope (group consolidated or company only)'
    period_days:
      type: int
      description: Length of the accounting period in days
    source:
      type: string
      description: Filing title and page
    source_url:
      type: string
      description: Companies House filing history
