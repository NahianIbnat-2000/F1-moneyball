# Research changelog: hand-written entries. The pipeline adds dataset entries automatically
# (data/metadata/changelog_auto.jsonl). Categories:
#   new_data | corrected_data | methodology | revised_analysis | publication | website
# Routine website changes are never described as research findings.
- date: 2026-11-19
  category: new_data
  title: Regulation events published
  detail: Eight financial, technical and power-unit rule changes, cost-cap levels sourced to secondary reporting and flagged until checked against FIA documents.
  datasets: [regulation_event]
- date: 2026-11-19
  category: methodology
  title: Financial efficiency and resource models defined
  detail: Efficiency ratio computed only within comparison groups of season, financial measure and currency with at least four teams. Points share regressed on the previous season's log resources (pooled, team fixed effects, two-way fixed effects), standard errors clustered by team. No results yet.
  datasets: [efficiency, model_results]
- date: 2026-11-19
  category: methodology
  title: Financial provenance fields and dataset status system
  detail: Every financial figure now records its document, transformation and comparability warning. Every dataset has one published status (published, not yet collected, under validation, insufficient coverage, unavailable at source, not comparable).
  datasets: [financial_observation]
- date: 2026-11-19
  category: website
  title: Editorial redesign, research article template, Data Explorer
  detail: Website changes only. No research content changed.
- date: 2026-11-19
  category: website
  title: Faster loading, path-based URLs, citations and changelog
  detail: Website changes only. Pages and charts load on demand, each page has its own URL and preview metadata, articles can be cited, and this changelog was added.
- date: 2026-11-19
  category: methodology
  title: Cost Cap Paradox designs defined
  detail: Interrupted time series on balance indicators (with and without a 2022 technical-reset term, Newey-West errors), placebo break years in the pre-cap period, and a dose-response comparison by pre-cap spending with an event study. No results yet; reported as descriptive or suggestive, never as the causal effect of the cap.
  datasets: [cost_cap_models, cost_cap_event_study]
- date: 2026-11-19
  category: methodology
  title: Grand Prix Economy designs defined
  detail: Race-month event study per host economy and synthetic control for race entry with placebo-in-space inference and a pre-fit quality rule. Monthly series are entered by hand from official sources. No data or results yet.
  datasets: [gp_tourism_monthly, gp_race_events, gp_event_study, gp_scm_path, gp_scm_inference]
- date: 2026-11-19
  category: website
  title: Racing theme
  detail: Website change only. Dark pit-wall design with livery colours; no research content changed.
- date: 2026-11-20
  category: revised_analysis
  title: Accounting comparability checks and multiple-testing correction
  detail: New robustness checks for Does Money Buy Speed? Controlling for group versus company accounts leaves the staff-cost estimate for points share almost unchanged (0.184 against 0.186) but raises its bootstrap p-value from 0.04 to 0.11. The staff-cost estimate for championship position holds (bootstrap p = 0.02). Scaling non-12-month accounts to a year and removing McLaren's share-based payments give similar results to the main model. After a Holm correction for the six main within-team tests, no result is significant at 5% (smallest adjusted p = 0.08). The working paper's abstract and robustness section were revised to say this.
  datasets: [robustness_checks]
- date: 2026-11-20
  category: methodology
  title: Large year-on-year changes checked against the filings
  detail: All 18 changes above 50% in turnover or staff costs, and the figures for the year before each, were checked against the stated page of the saved Companies House filings. All matched; no figure was changed. Validation now also warns about non-12-month accounting periods and switches between company and group accounts.
  datasets: [financial_observation]
- date: 2026-11-20
  category: publication
  title: Working paper revised
  detail: New abstract, accounting-comparability and multiple-testing results, Holm (1979) reference, and an appendix on how the financial data were built. Google Scholar tags added to the article page and a preferred citation added to CITATION.cff.
- date: 2026-11-20
  category: website
  title: Econometrics Lab, Data Provenance Explorer, accessibility
  detail: Website changes only. New pages for comparing model estimates and for tracing each financial figure to its filing. Charts and menus fit phone screens, and every page passes automated WCAG 2.1 AA checks.
- date: 2026-11-20
  category: revised_analysis
  title: Inflation-adjusted robustness check
  detail: Turnover and staff costs deflated by the UK CPI (ONS series D7BT, 2015 = 100). The two-way model cannot change by construction. In the team-effects model the staff-cost coefficient moves from 0.034 to 0.058 (bootstrap p = 0.40), so no conclusion changes.
  datasets: [robustness_checks]
- date: 2026-11-23
  category: methodology
  title: Small-sample inference reported for every model (version 3.1)
  detail: Approved by Nahian Ibnat. Clustered p-values and 95% intervals now use the t distribution with G - 1 degrees of freedom (G = 8 teams) instead of the normal distribution, and the fixed-effects models report a wild cluster bootstrap 95% interval obtained by inverting the bootstrap test, next to the bootstrap p-value. No coefficient and no bootstrap p-value changed. Clustered p-values rise (staff costs and points share, two-way model 0.11 to 0.16). The staff-cost bootstrap interval for points share (0.002 to 0.493) just excludes zero, matching its bootstrap p-value of 0.042; the earlier statement that every within-team interval includes zero referred to normal-based intervals and was revised. Normal-based columns are kept for comparison.
  datasets: [model_results, robustness_checks]
- date: 2026-11-23
  category: revised_analysis
  title: Comparable-account samples, other outcomes and timing added to the paper (version 3.1)
  detail: Approved by Nahian Ibnat. Table 4 of the paper reports two-way models on samples restricted by financial comparability, with team-by-accounting-basis effects, with two other outcomes, with a two-season lag and in the reverse direction, each with bootstrap intervals. The staff-cost position result keeps its size and significance in the restricted samples; the points-share result keeps its size but not its significance. Turnover follows last season's points at least as closely as the reverse (clustered p = 0.01, bootstrap p = 0.07). Conclusions unchanged; the reverse-direction result is added to the limitations.
  datasets: [robustness_checks, financial_comparability]
- date: 2026-11-23
  category: methodology
  title: Efficiency ratio renamed (version 3.1)
  detail: Approved by Nahian Ibnat. The ratio of points share to resource share is now called the points-to-resource-share ratio (points-to-turnover-share ratio for turnover), because it does not measure efficiency in the economic sense. Column efficiency_ratio renamed points_to_resource_share_ratio; values unchanged. The dataset file name (efficiency) is kept so links still work. The Lab's team comparison now takes the median over turnover only; it previously mixed turnover, staff costs and headcount.
  datasets: [efficiency]
- date: 2026-11-23
  category: corrected_data
  title: Source licences recorded; FIA documents linked instead of copied (version 3.1)
  detail: Approved by Nahian Ibnat. Every dataset now shows its sources' licence, attribution and restrictions in the Data Explorer. The grouped source "national statistics" was split into Statistik Austria, the Singapore Tourism Board and ONS, and OpenF1 was removed from the pit-stop dataset because no code uses it. The nine FIA regulation PDFs were removed from the repository and listed with official links and SHA-256 hashes in data/metadata/source_documents.csv; the Companies House filings stay until a document-level link for each is confirmed by hash.
  datasets: [regulation_event, pit_stop, gp_tourism_monthly]
- date: 2026-11-23
  category: methodology
  title: Bootstrap ties counted the same way on every computer (version 3.1)
  detail: Found by the new Replication workflow. In the wild cluster bootstrap, a draw that gives every team the same weight reproduces the observed t statistic exactly; this happens about once in 9,999 draws when there are six or seven teams. Whether that draw counted as "at least as extreme" depended on the last bit of floating-point rounding, so different computers gave p-values that differed by 1/9,999. Ties are now always counted, as the definition of the p-value requires. Effect on published numbers, in the 7-team restricted samples and the 6-team cost-cap dose-response models only - 10 bootstrap p-values rise by 0.0001 and 6 bootstrap interval ends move slightly (largest - headcount, high or moderate comparability, position - lower end from -13.04 to -13.09). No coefficient, no 8-team main result, no Holm-adjusted p-value and no conclusion changes.
  datasets: [robustness_checks]
- date: 2026-11-23
  category: corrected_data
  title: Companies House filings linked instead of copied (version 3.1)
  detail: Approved by Nahian Ibnat. The Source documents workflow confirmed by SHA-256 that 91 of the 105 filings downloaded from Companies House are identical to the copies the figures were read from; those copies were removed from the repository and replaced by official links and hashes in data/metadata/source_documents.csv. For the other 14 (Williams 2010-2019, Force India 2012, Caterham 2010-2012) candidate links were found by hand but not yet compared; their copies were moved to the author's private archive and removed from public distribution. Their 70 figures are kept and flagged in the new column source_document_status. Leaving them out (new robustness rows exclude_unverified_sources) leaves the staff-cost estimates almost unchanged (0.202 and -4.50 places, against 0.186 and -4.47) with wider uncertainty. No conclusion changes. Git history was not rewritten.
  datasets: [financial_observation, robustness_checks]
