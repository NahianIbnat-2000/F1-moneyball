# Dataset registry: the single source of truth for every dataset the website expects.
# The pipeline turns this into website/public/data/dataset_status.json.
# The frontend never hardcodes a dataset's status; it reads that file.
#
# status_if_absent: status used when the pipeline has not produced the dataset.
#   not_yet_collected | unavailable_at_source | insufficient_coverage | not_comparable
# Statuses set by the pipeline itself: published, under_validation, insufficient_coverage.

constructor_season:
  name: Constructor seasons
  modules: [moneyball, cost_cap]
  source_ids: [jolpica]
  status_if_absent: not_yet_collected
  would_contain: One row per team lineage and season (2010 onwards) with final points, position, wins, podiums, reliability, grid-to-finish gains and qualifying gap to pole.
  why_unavailable: The first automated pull from the Jolpica-F1 API has not run yet. The pull runs in GitHub Actions, not in the browser.
  needed_for_publication: One successful run of the Data pipeline workflow with all validation checks passing.

race_result:
  name: Race results
  modules: [moneyball]
  source_ids: [jolpica]
  status_if_absent: not_yet_collected
  would_contain: One row per car per Grand Prix with grid, finish, points, laps and retirement cause, classified as finished, mechanical, incident or unspecified.
  why_unavailable: The first automated pull from the Jolpica-F1 API has not run yet.
  needed_for_publication: One successful run of the Data pipeline workflow.

competitive_balance:
  name: Competitive balance by season
  modules: [cost_cap]
  source_ids: [jolpica]
  status_if_absent: not_yet_collected
  would_contain: One row per season with HHI, normalized HHI, Gini, coefficient of variation, top-3 points share and rank persistence.
  why_unavailable: Computed from constructor_season, which has not been collected yet.
  needed_for_publication: constructor_season published.

regulation_event:
  name: Regulation events
  modules: [cost_cap, moneyball]
  source_ids: [fia_regulations]
  status_if_absent: not_yet_collected
  would_contain: Financial, technical, sporting and power-unit rule changes with effective dates and sources.
  why_unavailable: Entered by hand from FIA documents and reporting of FIA decisions.
  needed_for_publication: Each event entered with a source URL.

financial_observation:
  name: Financial observations
  modules: [moneyball]
  source_ids: [companies_house]
  status_if_absent: not_yet_collected
  # Fewer teams than this in a season means shares of resources cannot be compared fairly.
  min_teams_per_season: 4
  would_contain: One row per reported or estimated financial figure (revenue, operating costs, staff costs, profit) with the legal entity, accounting period, currency, document, page and source classification.
  why_unavailable: No API provides F1 team finances. Figures must be read from statutory accounts (mainly UK Companies House filings) and entered by hand with page references. Ferrari and some other teams do not file comparable accounts.
  needed_for_publication: Audited figures for at least 4 teams in the same seasons, entered and validated.

pit_stop:
  name: Pit stops
  modules: [moneyball]
  source_ids: [jolpica, openf1]
  status_if_absent: not_yet_collected
  would_contain: One row per pit stop (2011 onwards) with lap, duration and team, for the operational efficiency analysis.
  why_unavailable: Ingestion for this endpoint is planned for Phase 2b and not yet written.
  needed_for_publication: Ingestion code, validation of durations, and a decision on how to treat red-flag and drive-through stops.

gp_tourism_monthly:
  name: Host-economy tourism series
  modules: [grand_prix_economy]
  source_ids: [national_statistics]
  status_if_absent: not_yet_collected
  would_contain: Monthly visitor arrivals, overnight stays or hotel occupancy for host economies (Singapore and Austria first) and comparison regions, one row per region, month and series, with the official table it came from.
  why_unavailable: Monthly series come from national statistics offices in different formats and must be downloaded and entered with their table references (data/manual/gp_tourism_monthly.csv). None entered yet.
  needed_for_publication: Official monthly series for at least one host economy and three comparison regions, covering at least two years before the race entered the calendar.

gp_race_events:
  name: Grand Prix race dates
  modules: [grand_prix_economy]
  source_ids: [jolpica]
  status_if_absent: not_yet_collected
  would_contain: One row per hosted race with region and race dates, used to mark race months.
  why_unavailable: Entered by hand together with the tourism series (data/manual/gp_race_events.csv). None entered yet.
  needed_for_publication: Race dates for each host region in the tourism dataset.

gp_event_study:
  name: Race-month event study
  modules: [grand_prix_economy]
  source_ids: [national_statistics]
  status_if_absent: not_yet_collected
  would_contain: For each host economy, the change in the monthly series in the two months before, the race month and the two months after, against the usual seasonal pattern, with confidence intervals.
  why_unavailable: Needs gp_tourism_monthly and gp_race_events.
  needed_for_publication: At least 36 months of a host series and one race date.

gp_scm_path:
  name: Synthetic control paths
  modules: [grand_prix_economy]
  source_ids: [national_statistics]
  status_if_absent: not_yet_collected
  would_contain: Observed and synthetic monthly series for each host around its first race, and the gap between them.
  why_unavailable: Needs a host series, three comparison regions and two years of data before the first race.
  needed_for_publication: At least 24 pre-entry months and 3 comparison regions.

gp_scm_inference:
  name: Synthetic control inference
  modules: [grand_prix_economy]
  source_ids: [national_statistics]
  status_if_absent: not_yet_collected
  would_contain: Pre- and post-entry fit for the host and every placebo region, the post/pre RMSPE ratio, donor weights and the placebo p-value.
  why_unavailable: Needs the synthetic control to be estimated.
  needed_for_publication: As for gp_scm_path.

efficiency:
  name: Financial efficiency indicators
  modules: [moneyball]
  source_ids: [companies_house, jolpica]
  status_if_absent: not_yet_collected
  would_contain: One row per team, season and financial measure with resource share, points share within the comparison group, the efficiency ratio, points per million and the rank gap. Rows that cannot be compared are kept with the reason.
  why_unavailable: Computed by the pipeline from financial_observation and constructor_season. Neither is published yet.
  needed_for_publication: At least 4 teams reporting the same measure in the same currency for the same season.

model_results:
  name: Resources and performance models
  modules: [moneyball]
  source_ids: [companies_house, jolpica]
  status_if_absent: not_yet_collected
  would_contain: Pooled OLS, team fixed-effects and two-way fixed-effects estimates of points share on last season's log resources, with clustered standard errors, confidence intervals, sample sizes and notes.
  why_unavailable: Needs a financial panel with lagged figures. No financial figures are entered yet.
  needed_for_publication: At least 20 team-seasons with a previous-season figure, from at least 4 teams and 3 seasons, for one measure.

cost_cap_models:
  name: Cost cap models
  modules: [cost_cap]
  source_ids: [jolpica, companies_house]
  status_if_absent: not_yet_collected
  would_contain: Interrupted time series estimates of the change in each balance indicator after 2021 (with and without a 2022 technical-reset term), placebo break years, and a dose-response comparison by pre-cap spending.
  why_unavailable: Needs competitive_balance (sporting data not yet collected). The dose-response model also needs pre-cap financial figures for at least 4 teams.
  needed_for_publication: Sporting data for 2010-2025 from the first pipeline run.

cost_cap_event_study:
  name: Cost cap event study
  modules: [cost_cap]
  source_ids: [jolpica, companies_house]
  status_if_absent: not_yet_collected
  would_contain: Season-by-season difference in points share between teams with higher and lower pre-cap spending, relative to 2020, used to check pre-trends.
  why_unavailable: Needs constructor_season and pre-cap (2018-2020) financial figures for at least 4 teams in one measure and currency.
  needed_for_publication: Sporting data plus audited 2018-2020 figures for at least 4 teams.
