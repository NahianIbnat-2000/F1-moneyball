# Every external source used by the pipeline. Add a source here before writing code that uses it.
jolpica:
  name: Jolpica-F1 API (Ergast-compatible)
  base_url: https://api.jolpi.ca/ergast/f1
  docs: https://github.com/jolpica/jolpica-f1
  terms: https://github.com/jolpica/jolpica-f1/blob/main/TERMS.md
  auth: none
  rate_limit: {burst_per_second: 4, sustained_per_hour: 500}
  # We stay well below the burst limit.
  # Jolpica rate-limits bursts in practice below the documented 4/s; 1 s spacing avoids most 429s.
  min_seconds_between_requests: 1.0
  page_size: 100
  coverage_note: Results since 1950, pit stops since 2011.
fastf1:
  name: FastF1 Python library
  docs: https://docs.fastf1.dev/
  auth: none
  coverage_note: Detailed timing data from 2018 onwards. Phase 2b.
openf1:
  name: OpenF1 API
  base_url: https://api.openf1.org/v1
  docs: https://openf1.org/
  auth: none for historical data
  coverage_note: 2023 onwards. Robustness source only.
f1db:
  name: F1DB
  docs: https://github.com/f1db/f1db
  licence: CC BY 4.0
  coverage_note: Used to cross-check team lineage.
companies_house:
  name: UK Companies House
  base_url: https://find-and-update.company-information.service.gov.uk/
  auth: free API key for the filing-history API (store as GitHub secret COMPANIES_HOUSE_API_KEY)
  coverage_note: Statutory audited accounts of UK-registered team entities. Figures entered manually.
fia_regulations:
  name: FIA Formula 1 regulations
  base_url: https://www.fia.com/regulation/category/110
  auth: none
liberty_media:
  name: Liberty Media investor information
  base_url: https://www.libertymedia.com/investors/financial-information
world_bank:
  name: World Bank WDI
  base_url: https://api.worldbank.org/v2
un_tourism:
  name: UN Tourism statistics
  base_url: https://www.unwto.org/tourism-statistics
national_statistics:
  name: National statistics offices and official tourism authorities
  docs: Each row in data/manual/gp_tourism_monthly.csv records its own official source URL and table ID.
