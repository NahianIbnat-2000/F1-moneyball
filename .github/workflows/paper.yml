name: Build paper
# Rebuilds the working paper from the published data, so the PDF on the website always matches the data.
# Runs after every successful Data pipeline run, and when the paper's source changes.
on:
  workflow_run:
    workflows: ["Data pipeline"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "paper/main.tex"
      - "paper/references.bib"
      - "paper/make_assets.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: paper, cancel-in-progress: false}
jobs:
  paper:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Numbers, tables and figures from the published data
        # Stops with a clear message if a statement in main.tex no longer matches the data.
        run: |
          pip install pandas numpy matplotlib
          python paper/make_assets.py
      - name: Compile LaTeX (biber, APA 7)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - name: Publish the PDF on the website
        run: |
          mkdir -p website/public/papers
          cp paper/main.pdf website/public/papers/Ibnat_Does_Money_Buy_Speed_working_paper.pdf
          git config user.name "f1-moneyball-paper"
          git config user.email "actions@users.noreply.github.com"
          git add paper/generated paper/main.pdf website/public/papers
          git diff --cached --quiet && echo "Paper unchanged" && exit 0
          git commit -m "paper: rebuild from published data"
          git pull --rebase
          git push
