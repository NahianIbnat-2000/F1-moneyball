name: Data pipeline
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC, after race weekends
  workflow_dispatch:
    inputs:
      start: {description: "First season", default: "2010"}
      end: {description: "Last season", default: "2025"}
      force: {description: "Re-download cached seasons", type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: data-pipeline, cancel-in-progress: false}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      # Raw API responses are cached between runs so finished seasons are never re-downloaded.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Ingest (rate-limited)
        run: python -m f1moneyball.pipeline ingest --start ${{ inputs.start || 2010 }} --end ${{ inputs.end || 2025 }} ${{ inputs.force && '--force' || '' }}
      - name: Build analysis tables
        run: python -m f1moneyball.pipeline build --start ${{ inputs.start || 2010 }} --end ${{ inputs.end || 2025 }}
      - name: Tests
        run: pytest -q
      # publish runs validation first and exits non-zero on any error, so nothing is written.
      - name: Validate and publish
        run: python -m f1moneyball.pipeline publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-report
          path: |
            reports/data_quality.md
            reports/data_quality.json
            data/metadata/retrieval_log.jsonl
      - name: Commit published data
        run: |
          git config user.name "f1-moneyball-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add website/public/data reports/data_quality.* data/metadata/retrieval_log.jsonl data/metadata/changelog_auto.jsonl
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: pipeline run ${{ github.run_id }}"
          git push
