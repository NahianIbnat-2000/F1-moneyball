name: Accessibility
# Runs axe-core (WCAG 2.1 A/AA and best practices) on every page at desktop and phone width.
# It does not block the deploy; a red cross here means a page needs fixing.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/accessibility.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json}
      - working-directory: website
        run: npm ci && npm run build
      - name: Check every page
        working-directory: website
        run: |
          npx vite preview --port 4174 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4174/ >/dev/null && break; sleep 2; done
          CHROME="$(which google-chrome)" node scripts/a11y.mjs
