name: Deploy website
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Data pipeline", "Build paper"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    # Never deploy after a failed pipeline run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Check website/index.html is the site's entry page
        # website/index.html must load the React app. It has twice been replaced by the one-page
        # summary, which lives in website/public/hub/index.html. Stop here instead of publishing a broken site.
        run: |
          if ! grep -q 'id="root"' website/index.html; then
            echo "::error file=website/index.html::This file is not the website's entry page. It may have been replaced by the one-page summary (that file belongs in website/public/hub/index.html). Restore website/index.html from an earlier commit."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]" && pytest -q && python -m f1moneyball.pipeline validate
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json}
      - working-directory: website
        run: npm ci && npm run build
        env:
          BASE_PATH: "/${{ github.event.repository.name }}/"
          # Absolute URL used for canonical links, Open Graph images and the sitemap.
          SITE_URL: "https://nahianibnat-2000.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with: {path: website/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
