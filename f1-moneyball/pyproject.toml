[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1moneyball"
version = "0.1.0"
description = "F1 Moneyball: An Independent Formula 1 Economics & Finance Research Platform."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.12", "pyarrow>=15", "duckdb>=1.0",
  "requests>=2.31", "pyyaml>=6.0", "statsmodels>=0.14", "linearmodels>=6.0", "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
operational = ["fastf1>=3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
